[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyfy"
dynamic = ["version"]
description = "Compress any file locally: images, PDFs, video, audio, Office documents, folders and more"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# authors = [{ email = "khanhleduy.work@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["Pillow>=9.1"]
keywords = ["compress", "compression", "image", "pdf", "video", "ffmpeg", "ghostscript", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]

[project.scripts]
tiny = "tinyfy.cli:main"
tinyfy = "tinyfy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tinyfy.__version__" }

[tool.setuptools.packages.find]
include = ["tinyfy*"]
